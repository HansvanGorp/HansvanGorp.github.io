# Regenerates the files derived from the site content and commits them,
# so GitHub Pages serves up-to-date versions:
#   images/cards/*.png  link-preview cards        (scripts/make_cards.py)
#   files/cv.pdf        PDF version of the CV page (scripts/cv-pdf.sh)
# See CLAUDE.md for details.
name: Build generated assets

on:
  push:
    branches: [master]
    paths:
      - "_pages/cv.md"
      - "_publications/**"
      - "_patents/**"
      - "_includes/**"
      - "_layouts/**"
      - "_sass/**"
      - "_config.yml"
      - "images/prof_pic_square.png"
      - "scripts/**"
      - ".github/workflows/generated-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate link-preview cards
        run: |
          pip install -r scripts/requirements.txt
          python scripts/make_cards.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Serve site locally
        run: bundle exec jekyll serve --config _config.yml,_config.dev.yml --detach

      - name: Render CV to PDF
        run: scripts/cv-pdf.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/cards files/cv.pdf
          git diff --cached --quiet || { git commit -m "Update generated cards and CV PDF"; git push; }
